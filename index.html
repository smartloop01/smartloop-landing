<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartLoop - Automacao, IA, Sites e Aplicativos.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SmartLoop">
  <link rel="apple-touch-icon" href="smartloop-splash.png">

  <link rel="icon" type="image/png" href="smartloop-splash.png" />

  <title>SmartLoop</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "/canvaskit/",
      pyodideUrl: "/pyodide/pyodide.js",
      webRenderer: "auto",
      fontFallbackBaseUrl: "assets/fonts/",
      appPackageUrl: "app.tar.gz"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });
  </script>

  <!-- fletAppConfig -->

  <script src="python.js"></script>
</head>

<body>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }

    if ("caches" in window) {
      caches.keys().then((keys) => {
        keys.forEach((key) => caches.delete(key));
      });
    }
  </script>

  <div id="loading">
    <style>
      body {
        background: #0F172A;
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        background: #0F172A;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        max-height: 230px;
        max-width: 230px;
        object-fit: contain;
        opacity: .96;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zoom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.92);
          opacity: 1;
        }

        to {
          transform: scale(0.86);
          opacity: .76;
        }
      }

      @keyframes zoom {
        from {
          transform: scale(0.92)
        }

        to {
          transform: scale(8)
        }
      }
    </style>
    <img src="smartloop-splash.png?v=2" alt="SmartLoop" />
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
